name: Build Renegade Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Build
        run: |
          cd Renegade
          make CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
               NATIVE="-march=armv8-a" \
               CXXFLAGS="-std=c++20 -O3 -funroll-loops -fno-exceptions -DNDEBUG -Wall -Wextra -pthread --target=aarch64-linux-android24"

      - name: List build output
        run: |
          find Renegade -maxdepth 1 -type f -executable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: renegade-android-arm64
          path: Renegade/Renegade
